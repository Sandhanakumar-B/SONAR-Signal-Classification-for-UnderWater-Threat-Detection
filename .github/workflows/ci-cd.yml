# =============================================================================
# SONAR Signal Classification — GitHub Actions CI/CD Pipeline
# Continuous Integration, Model Verification & Docker Image Deployment
# =============================================================================

name: SONAR Threat Detection CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Stage 1: Pipeline & Model Verification ──────────────────────────────────
  test:
    name: Model & Pipeline Verification Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment & Core Dependencies (Day 1)
        run: python test_environment.py

      - name: Run Full 9-Stage System Verification Suite (Day 10)
        run: python verify_system.py

  # ─── Stage 2: Docker Container Build & Liveness Test ─────────────────────────
  docker:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Local Container Run & REST API Liveness Test
        run: |
          docker build -t sonar-test-image:local .
          docker run -d --name sonar-test -p 5000:5000 sonar-test-image:local
          echo "Waiting for container startup and model loading..."
          sleep 6
          curl -f http://localhost:5000/api/health || (docker logs sonar-test && exit 1)
          docker stop sonar-test
          docker rm sonar-test
